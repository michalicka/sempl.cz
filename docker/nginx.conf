server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    error_page 404 /404.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json image/svg+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /kontakt {
        return 301 /#kontakt;
    }

    location = /kontakt/ {
        return 301 /#kontakt;
    }

    location = /feed {
        return 301 /;
    }

    location = /feed/ {
        return 301 /;
    }

    location ~ ^/(wp-admin|wp-content|wp-includes|wp-json)(/|$) {
        return 410;
    }

    location ~ ^/(wp-login|xmlrpc|wp-config|wp-cron)\.php$ {
        return 410;
    }

    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location ~ (^|/)\. {
        return 403;
    }

    location ~* \.(bak|old|orig|sql|log|ini|sh|md)$ {
        return 403;
    }

    location ~* \.(css|js|woff2|png|jpg|jpeg|webp|svg|ico)$ {
        expires 30d;
        try_files $uri =404;
    }

    location ~* \.(html|xml|txt|webmanifest)$ {
        expires 1h;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
